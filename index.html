<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timer ture alergare</title>

<style>

html, body {
    height: 100%;
    margin: 0;
}

.track-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
}

.track-bg img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.55) contrast(1.1);
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: #d7e7d7;
    text-align: center;
    background: #0a0505;
}

.container{
    width: 100%;
    max-width: 700px;
    padding: 30px 20px;
}

.timer{
    font-size: 64px;
    font-weight: 600;
    color: #7CFF6B;
    text-shadow: 0 0 20px rgba(124,255,107,0.25);
}

.subtitle{
    font-size: 20px;
    color: #cfe3cf;
    margin-top: 8px;
}

table{
    width: 100%;
    margin: 40px auto;
    border-collapse: collapse;
    font-size: 16px;
    background: rgba(0,0,0,0.35);
    border-radius: 12px;
    overflow: hidden;
}

th{
    padding: 16px;
    color:#b8d6b8;
}

td{
    padding: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.ready{
    color: #ffffff;
}

.active{
    color: #ff9a2f;
    font-weight: bold;
}

.done{
    color: #00ff6a;
    font-weight: bold;
}

.buttons{
    position: fixed;
    bottom: 40px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 15px;
}

button{
    border: none;
    border-radius: 999px;
    padding: 14px 40px;
    font-size: 18px;
    cursor: pointer;
}

.start{
    background: linear-gradient(135deg, #00ff6a, #1a7f3a);
    color: white;
}

.reset{
    background: rgba(255,255,255,0.15);
    color: white;
}

button:hover{
    transform: scale(1.03);
    transition: 0.2s;
}

</style>

</head>

<body>

<div class="track-bg">
    <img src="https://www.atlassport.ro/wp-content/uploads/2025/11/1-1-1.jpg">
</div>

<div class="container">

<div class="timer" id="timer">02:05</div>
<div class="subtitle" id="currentLap">Tura 1 / 4</div>

<table>
<tr>
<th>Tură</th>
<th>Timp tură</th>
<th>Status</th>
</tr>

<tbody id="laps">
<tr><td>01</td><td>02:05</td><td id="s1" class="ready">Pregătită</td></tr>
<tr><td>02</td><td>02:05</td><td id="s2" class="ready">Pregătită</td></tr>
<tr><td>03</td><td>02:05</td><td id="s3" class="ready">Pregătită</td></tr>
<tr><td>04</td><td>02:05</td><td id="s4" class="ready">Pregătită</td></tr>
</tbody>
</table>

<div class="buttons">
<button class="reset" onclick="resetTimer()">Resetare</button>
<button class="start" onclick="startPause()" id="startBtn">Pornire</button>
</div>

</div>

<script>

const lapTime = 125;
let remaining = lapTime;
let lap = 1;
let running = false;
let interval;

function displayTime(sec){
let m = Math.floor(sec/60);
let s = sec%60;
document.getElementById("timer").innerHTML =
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function sound(){
let ctx = new (window.AudioContext || window.webkitAudioContext)();

let osc1 = ctx.createOscillator();
let gain1 = ctx.createGain();

let osc2 = ctx.createOscillator();
let gain2 = ctx.createGain();

osc1.type="triangle";
osc1.frequency.value=650;

osc2.type="sine";
osc2.frequency.value=1200;

gain1.gain.setValueAtTime(0.0001, ctx.currentTime);
gain1.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime+0.05);
gain1.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);

gain2.gain.setValueAtTime(0.0001, ctx.currentTime);
gain2.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime+0.05);
gain2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.45);

osc1.connect(gain1);
osc2.connect(gain2);
gain1.connect(ctx.destination);
gain2.connect(ctx.destination);

osc1.start();
osc2.start();

setTimeout(()=>{osc1.stop(); osc2.stop();},500);
}

function startPause(){

if(running){
clearInterval(interval);
running=false;
document.getElementById("startBtn").innerHTML="Reluare";
return;
}

running=true;
document.getElementById("startBtn").innerHTML="Pauză";

/* 🔥 FIX IMPORTANT: activez imediat tura 1 */
document.getElementById("s"+lap).className = "active";
document.getElementById("s"+lap).innerHTML = "În desfășurare";

interval=setInterval(()=>{

remaining--;
displayTime(remaining);

if(remaining<=0){

sound();

/* FINAL corect */
document.getElementById("s"+lap).className = "done";
document.getElementById("s"+lap).innerHTML = "Finalizată ✅️🏃";

if(lap>=4){
clearInterval(interval);
running=false;
document.getElementById("startBtn").innerHTML="Finalizat";
document.getElementById("currentLap").innerHTML="Gata";
return;
}

lap++;
document.getElementById("currentLap").innerHTML="Tura "+lap+" / 4";

document.getElementById("s"+lap).className = "active";
document.getElementById("s"+lap).innerHTML = "În desfășurare";

remaining = lapTime;
displayTime(remaining);
}

},1000);

}

function resetTimer(){
clearInterval(interval);
running=false;
lap=1;
remaining=lapTime;

displayTime(remaining);

document.getElementById("currentLap").innerHTML="Tura 1 / 4";
document.getElementById("startBtn").innerHTML="Pornire";

for(let i=1;i<=4;i++){
document.getElementById("s"+i).className="ready";
document.getElementById("s"+i).innerHTML="Pregătită";
}
}

displayTime(remaining);

</script>

</body>
</html>
